<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TKAM Vocabulary Memorizer</title>
<style>
  :root {
    --bg:#f6f7fb; --card:#ffffff; --ink:#172033; --muted:#68738a; --line:#e2e6ef;
    --accent:#304ffe; --accent-soft:#eef2ff; --good:#1b8f4d; --bad:#d63636;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f7f8ff,#eef2f7); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif; }
  button, select, input { font:inherit; }
  button { border:0; border-radius:14px; padding:12px 15px; font-weight:800; cursor:pointer; background:#edf1ff; color:#2037a8; }
  button.primary { background:var(--accent); color:#fff; }
  button.ghost { background:#f3f5fa; color:#30384a; }
  button.bad { background:#ffeded; color:var(--bad); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  select, input[type="text"] { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:14px; background:#fff; font-size:15px; outline:none; }
  select:focus, input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(48,79,254,.12); }
  label { display:block; font-weight:800; font-size:12px; margin-bottom:6px; color:#35405a; }

  .topbar { position:sticky; top:0; z-index:10; background:rgba(246,247,251,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .top-inner { width:min(1280px,96vw); margin:0 auto; padding:14px 0; display:grid; grid-template-columns:1.1fr 2.3fr auto; gap:14px; align-items:center; }
  h1 { margin:0; font-size:clamp(18px,2vw,28px); letter-spacing:-.04em; line-height:1.1; }
  .sub { color:var(--muted); font-size:12px; margin-top:4px; }
  .controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); gap:10px; align-items:end; }
  .top-actions { display:flex; gap:8px; align-items:end; }

  main { width:min(1280px,96vw); margin:16px auto 32px; }
  .app-layout { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:14px; align-items:stretch; }
  .quiz-card { min-height:calc(100vh - 150px); background:var(--card); border:1px solid var(--line); border-radius:28px; box-shadow:0 16px 45px rgba(25,35,70,.08); display:flex; flex-direction:column; overflow:hidden; }
  .quiz-head { padding:18px 22px 0; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .badge { display:inline-flex; gap:8px; align-items:center; background:#f0f3ff; color:#2f3fa8; border-radius:999px; padding:8px 12px; font-size:13px; font-weight:900; }
  .enter-tip { color:var(--muted); font-size:12px; }
  .question-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px clamp(20px,5vw,72px); }
  .mode-label { color:var(--accent); font-weight:900; font-size:14px; margin-bottom:16px; }
  .question { font-size:clamp(28px,4.8vw,58px); line-height:1.22; font-weight:900; letter-spacing:-.045em; word-break:keep-all; }
  .hint { color:var(--muted); line-height:1.65; font-size:15px; margin-top:16px; }
  .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:28px; }
  .choice { text-align:left; background:#f7f8fc; color:#1e2638; border:1px solid var(--line); font-weight:700; line-height:1.5; padding:14px 16px; min-height:70px; }
  .choice:hover { border-color:#b7c2ff; background:#f2f5ff; }

  .bottom-panel { border-top:1px solid var(--line); background:#fbfcff; padding:16px clamp(16px,3vw,34px); }
  .answer-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; }
  .answer-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .feedback { margin-top:12px; border-radius:16px; padding:14px; display:none; line-height:1.55; }
  .feedback.ok { display:block; background:#eaf8ef; color:#126b39; }
  .feedback.no { display:block; background:#fff0f0; color:#9d2525; }

  .side { display:grid; gap:12px; align-content:start; }
  .mini { background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:20px; padding:13px; box-shadow:0 10px 28px rgba(25,35,70,.05); }
  .mini h3 { margin:0 0 10px; font-size:14px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:#f9fafc; border:1px solid var(--line); border-radius:14px; padding:9px; text-align:center; }
  .stat b { display:block; font-size:18px; }
  .stat span { color:var(--muted); font-size:11px; }
  .progress { height:8px; background:#edf0f7; border-radius:999px; overflow:hidden; margin-top:10px; }
  .bar { height:100%; width:0; background:var(--accent); transition:.25s; }
  .wrong-list { max-height:260px; overflow:auto; padding-right:3px; }
  .wrong-item { padding:9px 0; border-bottom:1px solid var(--line); font-size:12px; line-height:1.45; }
  .term { font-weight:900; }
  .reset-row { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:8px; }
  .reset-row button { padding:7px 9px; font-size:12px; }

  .table-wrap { margin-top:14px; display:none; background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:24px; padding:16px; box-shadow:0 12px 40px rgba(25,35,70,.08); }
  .table-head { display:flex; gap:10px; margin-bottom:12px; align-items:center; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:18px; overflow:hidden; }
  th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:13px; }
  th { background:#f2f4fa; }

  @media (max-width:980px) {
    .top-inner { grid-template-columns:1fr; }
    .controls { grid-template-columns:1fr; }
    .top-actions { justify-content:stretch; }
    .top-actions button { width:100%; }
    .app-layout { grid-template-columns:1fr; }
    .quiz-card { min-height:calc(100vh - 260px); }
    .side { grid-template-columns:1fr; }
    .choices { grid-template-columns:1fr; }
    .answer-row { grid-template-columns:1fr; }
    .answer-actions { justify-content:stretch; }
    .answer-actions button { flex:1; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <div>
      <h1>TKAM 단어 암기</h1>
      <div class="sub">총 <b id="totalWords"></b>개 단어 · 주관식 / 4지선다 선택 가능 · Enter로 채점/다음 문제</div>
    </div>
    <div class="controls">
      <div><label>학습 범위</label><select id="chapterSelect"><option value="all">전체 Chapter</option></select></div>
      <div><label>암기 항목</label><select id="modeSelect"><option value="def2word">뜻 → 단어</option><option value="word2def">단어 → 뜻</option><option value="sentence">예문 빈칸 → 단어</option></select></div>
      <div><label>문제 형식</label><select id="formatSelect"><option value="subjective">주관식</option><option value="choice">4지선다</option></select></div>
      <div><label>출제 순서</label><select id="orderSelect"><option value="shuffle">랜덤</option><option value="order">자료 순서</option><option value="wrong">틀린 단어만</option></select></div>
    </div>
    <div class="top-actions">
      <button class="ghost" id="toggleListBtn">전체 단어표 보기</button>
      <button class="primary" id="startBtn">시작 / 다시 섞기</button>
    </div>
  </div>
</header>
<main>
  <section class="table-wrap" id="tableWrap">
    <div class="table-head"><input id="searchInput" type="text" placeholder="단어 검색"/><button id="clearSearch">초기화</button></div>
    <table><thead><tr><th>Chapter</th><th>단어</th><th>뜻</th></tr></thead><tbody id="wordTable"></tbody></table>
  </section>

  <section class="app-layout">
    <section class="quiz-card">
      <div class="quiz-head">
        <div class="badge" id="badge">Chapter</div>
        <div class="enter-tip">Enter: 채점 → 다음 문제</div>
      </div>
      <div class="question-wrap">
        <div class="mode-label" id="modeLabel">학습 방식</div>
        <div class="question" id="question">시작 버튼을 눌러 학습을 시작하세요.</div>
        <div class="hint" id="hint"></div>
        <div id="choices" class="choices"></div>
      </div>
      <div class="bottom-panel">
        <div class="answer-row">
          <input id="answerInput" type="text" placeholder="정답 입력 후 Enter" autocomplete="off" />
          <button class="primary" id="checkBtn">채점</button>
          <div class="answer-actions">
            <button class="ghost" id="showBtn">정답 표시</button>
            <button class="ghost" id="nextBtn">스킵하기</button>
          </div>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
    </section>

    <aside class="side">
      <div class="mini">
        <h3>현황</h3>
        <div class="stats">
          <div class="stat"><b id="done">0</b><span>푼 문제</span></div>
          <div class="stat"><b id="correct">0</b><span>정답</span></div>
          <div class="stat"><b id="wrong">0</b><span>오답</span></div>
          <div class="stat"><b id="accuracy">0%</b><span>정답률</span></div>
          <div class="stat"><b id="left">0</b><span>남은 단어</span></div>
          <div class="stat"><b id="savedWrong">0</b><span>저장 오답</span></div>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="mini">
        <div class="reset-row"><h3 style="margin:0">틀린 단어</h3><button class="bad" id="resetWrongBtn">초기화</button></div>
        <div class="wrong-list" id="wrongList"><div class="hint">아직 틀린 단어가 없습니다.</div></div>
      </div>
    </aside>
  </section>
</main>

e": 6}, {"chapter": "Chapter 2", "term": "smilax", "definition": "a bright green plant, often used for decorating houses", "pos": "noun", "page": 6}, {"chapter": "Chapter 2", "term": "sojourn", "definition": "a visit", "pos": "noun", "page": 6}, {"chapter": "Chapter 2", "term": "subsequent mortification", "definition": "Something that is subsequent will follow closely after something else. Mortification is a feeling of shame or the loss of self-respect. If Scout had been able to explain things to Miss Caroline, she could have prevented her teacher from losing self-respect or feeling shameful later on.", "pos": "adjective + noun", "page": 6}, {"chapter": "Chapter 2", "term": "uninitiated", "definition": "not aware of or not understanding something new", "pos": "adjective", "page": 6}, {"chapter": "Chapter 2", "term": "wallowing illicitly", "definition": "In this case, to wallow is to greatly enjoy something. Illicit, used like this, means illegal or unauthorized or improper. After listening to Miss Caroline, Scout feels that, by reading, she has been happily doing something which she should not have been doing.", "pos": "verb, continuous tense + adverb", "page": 6}, {"chapter": "Chapter 2", "term": "Bullfinch", "definition": "a reference to a book called Bullfinch’s Mythology which is a well-known collection of Greek myths. While Jem is teasing Scout, his reference to Bullfinch’s Mythology is another indication that Scout reads a great deal.", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "Dewey Decimal System", "definition": "A system for organizing books in libraries devised by Melvil Dewey. Contrary to what Jem tells Scout, this Dewey has nothing to do with John Dewey, a famous American educator.", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "diaries of Lorenzo Dow", "definition": "Lorenzo Dow (1777 - 1834) was a Methodist preacher who travelled throughout the country, including the state of Alabama.", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "a quarter", "definition": "a coin worth 25 cents", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "the crash", "definition": "the Stock Market Crash of 1929, which led to the Great Depression. See information in the Study Guide.", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "The Mobile Register", "definition": "the name of a newspaper. Scout is able to read the information in it about the stock market", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "union suit", "definition": "a one-piece underwear garment with a buttoned flap in the back", "pos": "", "page": 6}, {"chapter": "Chapter 2", "term": "Union", "definition": "one of the two sides in the Civil War (the North)", "pos": "", "page": 6}, {"chapter": "Chapter 3", "term": "amiable", "definition": "friendly", "pos": "adjective", "page": 6}, {"chapter": "Chapter 3", "term": "compromise", "definition": "an agreement where each person agrees to give up something", "pos": "noun", "page": 6}, {"chapter": "Chapter 3", "term": "contemptuous", "definition": "To be contemptuous is to have the feeling that someone or something is beneath you; that it or they are worthless. The Ewell boy seems to feel this way about his teacher, Miss Caroline.", "pos": "adjective", "page": 6}, {"chapter": "Chapter 3", "term": "contentious", "definition": "In the chapter it means always ready to argue or fight", "pos": "adjective.", "page": 6}, {"chapter": "Chapter 3", "term": "cootie", "definition": "a slang term for a head louse. A louse (plural: lice) is a bloodsucking parasite.", "pos": "noun", "page": 6}, {"chapter": "Chapter 3", "term": "crackling bread", "definition": "a type of mealie bread mixed with cracklings (bits of fried pork skin)", "pos": "noun", "page": 6}, {"chapter": "Chapter 3", "term": "diminutive", "definition": "very small", "pos": "adjective", "page": 6}, {"chapter": "Chapter 3", "term": "disapprobation", "definition": "disapproval", "pos": "noun", "page": 6}, {"chapter": "Chapter 3", "term": "discernible", "definition": "noticeable or understandable", "pos": "adjective", "page": 6}, {"chapter": "Chapter 3", "term": "dispensation", "definition": "a release from an obligation or promise.", "pos": "noun", "page": 6}, {"chapter": "Chapter 4", "term": "arbitrated", "definition": "made a ruling", "pos": "verb, past tense", "page": 7}, {"chapter": "Chapter 4", "term": "auspicious", "definition": "favourable; suggesting success in the future", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "hollered", "definition": "shouted", "pos": "verb, past tense", "page": 7}, {"chapter": "Chapter 4", "term": "melancholy", "definition": "sad and gloomy", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "quelling (of) nausea", "definition": "(verb, continuous tense + noun):", "pos": "of", "page": 7}, {"chapter": "Chapter 4", "term": "scuppernongs", "definition": "sweet table grapes, grown chiefly in the southern United States", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "suffocating", "definition": "having difficulty in breathing", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "transparent", "definition": "able to be seen through. Scout means that it is easy to work out what Jem is thinking.", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "unanimous", "definition": "when everyone is in agreement", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "dose (of) Magnesia", "definition": "A dose is an exact amount of medicine. Magnesia is a type of medicine.", "pos": "of", "page": 7}, {"chapter": "Chapter 4", "term": "eddy", "definition": "a current of water that moves against the main current; a whirlpool", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "erratic", "definition": "irregular; Calpurnia usually uses good grammar, but when she is angry, her grammar is irregular (i.e. sometimes correct and sometimes incorrect).", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "flinty", "definition": "Flint is a very hard rock. Something that is flinty is extremely hard and firm.", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "fractious", "definition": "mean or cross", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "gravely", "definition": "seriously", "pos": "adverb", "page": 7}, {"chapter": "Chapter 4", "term": "haint", "definition": "a ghost or spook; someone or something very scary", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "irked", "definition": "to be irked is to be annoyed. Scout is annoyed when Jem tells Walter that she won’t fight with him (Walter) anymore.", "pos": "verb", "page": 7}, {"chapter": "Chapter 4", "term": "kerosene", "definition": "paraffin", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "lye soap", "definition": "Lye is a very strong alkaline substance used for cleaning. Lye soap is very strong, harsh soap that contains lye.", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "monosyllabic", "definition": "Mono means ‘one’. A syllable is word or a part of a word which can be pronounced with a single, uninterrupted sound. The name ‘Atticus’, for example, is made up of three syllables: at + ti + cus. Thus, monosyllabic literally means ‘one sound’. Scout’s monosyllabic replies to Atticus’s questions about her first day at school might have been made up of one- sound words like ‘yes’ and ‘no’.", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "mutual concessions", "definition": "A concession is an agreement; something that is mutual is done by two or more people. Thus, a mutual concession occurs when two or more people agree on something.", "pos": "adjective + noun", "page": 7}, {"chapter": "Chapter 4", "term": "onslaught", "definition": "a violent attack", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "pecans", "definition": "a pecan is a type of nut that is good to eat", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "persevere", "definition": "to carry on in spite of difficulties", "pos": "verb", "page": 7}, {"chapter": "Chapter 4", "term": "phenomenal", "definition": "very unusual", "pos": "adjective", "page": 7}, {"chapter": "Chapter 4", "term": "tranquillity", "definition": "peacefulness; calmness", "pos": "noun", "page": 7}, {"chapter": "Chapter 4", "term": "what the sam hill", "definition": "an American slang expression meaning what the devil or what the hell", "pos": "", "page": 7}, {"chapter": "Chapter 4", "term": "Indian-heads", "definition": "Before the head of American president Abraham Lincoln was placed on a US one cent coin (a penny) pennies had the head of a native American (an American Indian) on them.", "pos": "", "page": 8}, {"chapter": "Chapter 4", "term": "One Man’s Family", "definition": "a radio serial (like a soap opera) which began in 1932 and proved to be enormously popular for almost 30 years. By acting out their version of the Radley story the children are making up their own version of the drama.", "pos": "", "page": 8}, {"chapter": "Chapter 5", "term": "asinine", "definition": "stupid; silly", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "benevolence", "definition": "generous behaviour", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "benign", "definition": "kind and gentle", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "bridgework", "definition": "Unlike dentures (false teeth), which replace the upper or lower sets of teeth, bridgework is made up of sections of replacement teeth that can be inserted and removed from one’s mouth.", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "chameleon", "definition": "In nature, chameleons are small lizards that have the unusual ability to change the colour of their skin in order to blend into their surroundings. By calling Miss Maudie a chameleon lady, Scout points out that her neighbour’s appearance was as changeable as one of these lizards: when she worked in her garden she wore an old hat and men’s overalls but in the evening she dressed up.", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "cordiality", "definition": "sincere affection and kindness", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "edification", "definition": "education; instruction", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "gaped", "definition": "To gape at someone is to stare at that person with your mouth open.", "pos": "verb, past tense", "page": 8}, {"chapter": "Chapter 5", "term": "inquisitive", "definition": "curious; questioning; interested in everything", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "mimosa", "definition": "a flowering shrub or tree", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "morbid", "definition": "having a strong interest in unpleasant subjects, especially death; gruesome", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "nagging", "definition": "the action of asking, over and over again in an annoying way, that someone should do something", "pos": "noun", "page": 8}, {"chapter": "Chapter 5", "term": "placidly", "definition": "calmly; quietly", "pos": "adverb", "page": 8}, {"chapter": "Chapter 5", "term": "Protestant", "definition": "Protestant is the name given to Christian churches other than the Roman Catholic church. Protestant churches mentioned in the novel include the Baptist and the Methodist churches.", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "pulpit Gospel", "definition": "A pulpit is the raised platform or lectern from which a preacher speaks in church. The Gospel refers to the teachings of Jesus Christ, specifically the first four books of the New Testament. Scout says that her faith in what she’s heard about the teachings of Christ from the pulpit (preacher) in her own church has been shaken a bit.", "pos": "adjective + noun", "page": 8}, {"chapter": "Chapter 5", "term": "quibbling", "definition": "a way of arguing in which the speaker brings up small and unimportant details", "pos": "verb, continuous tense", "page": 8}, {"chapter": "Chapter 5", "term": "tacit", "definition": "a word used to describe an agreement, or, in this case, a ‘treaty’ that has been made without anything being said. The children know that they can play on Miss Maudie’s front lawn even though she had never directly told them that it was all right to do so.", "pos": "adjective", "page": 8}, {"chapter": "Chapter 5", "term": "tormenting", "definition": "being deliberately cruel to someone", "pos": "verb, continuous tense", "page": 8}, {"chapter": "Chapter 6", "term": "collards", "definition": "a type of cabbage with very coarse leaves. It would be difficult to walk quietly through a patch of collards.", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "commotion", "definition": "sudden noise or activity", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "dismemberment", "definition": "To dismember someone is to tear or cut that person’s limbs (arms and legs) off. Although it is unlikely that anyone would have actually pulled off Dill’s arms and legs, Harper Lee uses the word to point out how outraged Miss Rachel must have been to discover that the children had been playing strip poker.", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "eerily", "definition": "strangely; mysteriously", "pos": "adverb", "page": 9}, {"chapter": "Chapter 6", "term": "ensuing", "definition": "Something that ensues is something that comes immediately after something else.", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "Franklin stove", "definition": "a cast iron heating stove, invented by Benjamin Franklin", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "hovering", "definition": "staying in one place in the air", "pos": "verb, continuous tense", "page": 9}, {"chapter": "Chapter 6", "term": "kudzu", "definition": "a quick-growing vine with large leaves, often found in the southern United States", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "lattice-work", "definition": "a structure of crossed strips or bars, as in a screen; Light that passes through any kind of a lattice -work would produce lattice-work shadows.", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "malignant", "definition": "very bad; dangerous; evil", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "prowess", "definition": "great ability or skill", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "ramshackle", "definition": "loose or rickety; about to fall apart", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "respiration", "definition": "breathing", "pos": "noun", "page": 9}, {"chapter": "Chapter 6", "term": "rigid", "definition": "very stiff", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "waning", "definition": "becoming less bright, intense, or strong; The moonlight is waning because it’s getting closer to morning, and the moon is changing its position in the sky.", "pos": "adjective", "page": 9}, {"chapter": "Chapter 6", "term": "Old Testament pestilence", "definition": "Pestilence refers to a condition or disease that causes great damage or death. One example of pestilence in the Old Testament of the Bible is a plague of locusts.", "pos": "", "page": 9}, {"chapter": "Chapter 6", "term": "Second Battle of the Marne", "definition": "a battle in World War I (1914-1918).", "pos": "", "page": 9}, {"chapter": "Chapter 7", "term": "cleaved", "definition": "stuck to", "pos": "verb, past tense", "page": 10}, {"chapter": "Chapter 7", "term": "gnats", "definition": "small, winged insects that can bite or sting. [Pronounced: NAT]", "pos": "noun", "page": 10}, {"chapter": "Chapter 7", "term": "hoodooing", "definition": "actions that cause bad luck; performing a kind of witchcraft", "pos": "noun", "page": 10}, {"chapter": "Chapter 7", "term": "meditative", "definition": "To meditate is to reflect upon something, or think about it. When Jem gives the patch on the tree a meditative pat, he touches it in a thoughtful way.", "pos": "adjective", "page": 10}, {"chapter": "Chapter 7", "term": "miniatures", "definition": "very small copies of something bigger", "pos": "noun", "page": 10}, {"chapter": "Chapter 7", "term": "palate", "definition": "the roof of one’s mouth", "pos": "noun", "page": 10}, {"chapter": "Chapter 7", "term": "perpetual embalming", "definition": "Something that is perpetual lasts forever. Embalming is the process of preserving a dead body. The Egyptians invented a type of paper (not toilet paper), as well as embalming which, by its very nature, is perpetual and that is why Atticus said that Jem did not need to use the word ‘perpetual’.", "pos": "adjective + noun", "page": 10}, {"chapter": "Chapter 7", "term": "rendered (her) speechless", "definition": "(verb, past tense + noun):", "pos": "her", "page": 10}, {"chapter": "Chapter 7", "term": "vigil", "definition": "a period of time during which a person or group of people stay(s) quietly for a period of time. Jem is waiting and watching for Mr Nathan to appear.", "pos": "noun", "page": 10}, {"chapter": "Chapter 7", "term": "whittles", "definition": "To whittle is to use a knife to cut away thin shavings of wood, sometimes to make an object.", "pos": "verb, present tense", "page": 10}, {"chapter": "Chapter 8", "term": "aberrations", "definition": "An aberration is something that is completely different from what usually happens. The fact that winter comes so quickly in Maycomb is very unusual and is thus an aberration.", "pos": "noun", "page": 10}, {"chapter": "Chapter 8", "term": "cannas", "definition": "brightly coloured flowering plants", "pos": "noun", "page": 10}, {"chapter": "Chapter 8", "term": "caricatures", "definition": "drawings or descriptions of a person that change some of their features to make them look silly or strange", "pos": "noun", "page": 10}, {"chapter": "Chapter 8", "term": "cordial", "definition": "warm and friendly", "pos": "adjective", "page": 10}, {"chapter": "Chapter 8", "term": "flue", "definition": "a channel in a chimney that allows smoke and flames to pass to the outside", "pos": "noun", "page": 10}, {"chapter": "Chapter 8", "term": "meteorological", "definition": "anything to do with meteorology or weather", "pos": "adjective", "page": 10}, {"chapter": "Chapter 8", "term": "morphodite", "definition": "Scout has misheard Miss Maudie, who would actually have said the word hermaphrodite. Technically, a hermaphrodite is an animal or plant that has both female and male reproductive organs. Of course, the children’s snowman is not really a hermaphrodite, but it does have both male and female characteristics.", "pos": "noun", "page": 10}, {"chapter": "Chapter 8", "term": "near libel", "definition": "When you commit libel, you harm someone’s reputation. Atticus tells the children that they have committed a near libel. Their snowman is almost libellous because it so closely represents one of their neighbours and could harm that neighbour’s reputation.", "pos": "adjective + noun", "page": 10}, {"chapter": "Chapter 8", "term": "perpetrated", "definition": "carried out; committed", "pos": "verb, past tense", "page": 10}, {"chapter": "Chapter 8", "term": "plaited", "definition": "braided", "pos": "verb, past tense", "page": 10}, {"chapter": "Chapter 8", "term": "procured", "definition": "got; obtained", "pos": "verb, past tense", "page": 10}, {"chapter": "Chapter 8", "term": "prophets", "definition": "Prophets are people who are able to predict the future.", "pos": "noun", "page": 11}, {"chapter": "Chapter 8", "term": "quelled", "definition": "To quell is to stop something. The tin roof of Miss Maudie’s house quelled the flames because tin cannot burn and so the fire eventually stopped.", "pos": " ome ways, make up for the fact that, for Scout, spending the holidays with her and Francis is not a lot of fun.", "pos": "noun", "page": 11}, {"chapter": "Chapter 9", "term": "constituted", "definition": "made up or consisted of", "pos": "verb, past tense", "page": 11}, {"chapter": "Chapter 9", "term": "crooned", "definition": "To croon is to sing in a low, gentle tone.", "pos": "verb, past tense", "page": 11}, {"chapter": "Chapter 9", "term": "deportment", "definition": "way of walking or, more generally, of behaving", "pos": "noun", "page": 11}, {"chapter": "Chapter 9", "term": "dim", "definition": "unclear; not strong", "pos": "adjective", "page": 11}, {"chapter": "Chapter 9", "term": "Appomattox", "definition": "a place in the state of Virginia; On April 9, 1865 Confederate General Robert E. Lee surrendered to Union General Ulisses S. Grant at the Appomattox Court House, ending the American Civil War.", "pos": "", "page": 11}, {"chapter": "Chapter 9", "term": "Bellingraths", "definition": "Miss Maudie is referring to Walter and Bessie Bellingrath who, in 1932, opened their large, beautiful gardens to the public.", "pos": "", "page": 11}, {"chapter": "Chapter 9", "term": "Lane cake", "definition": "a rich white cake.", "pos": "", "page": 11}, {"chapter": "Chapter 9", "term": "Rosetta Stone", "definition": "This was discovered in Egypt in 1799. It is a large piece of rock on which there is writing in three languages which gave historians many clues to the meaning of Egyptian hieroglyphs (picture writing). The writing gives information about a law passed in 196 BC.", "pos": "", "page": 11}, {"chapter": "Chapter 9", "term": "donned", "definition": "put on", "pos": "verb, past tense", "page": 12}, {"chapter": "Chapter 9", "term": "doused", "definition": "to douse someone is to pour liquid, in this case water, all over that person.", "pos": "verb, past tense", "page": 12}, {"chapter": "Chapter 9", "term": "evasion", "definition": "avoidance; to evade is to avoid doing     $('modeLabel').textContent=`단어 → 뜻 · ${isChoice?'4지선다':'주관식'}`;
    $('question').textContent=current.term;
    $('hint').textContent=isChoice ? '단어의 뜻으로 가장 알맞은 것을 고르세요.' : '뜻을 직접 입력하세요. 핵심 단어가 맞으면 정답으로 처리됩니다.';
  } else {
    $('modeLabel').textContent=`예문 빈칸 → 단어 · ${isChoice?'4지선다':'주관식'}`;
    $('question').textContent=makeSentence(current);
    $('hint').textContent=isChoice ? '빈칸에 들어갈 영어 단어를 고르세요.' : '빈칸에 들어갈 영어 단어를 입력하세요.';
  }
  if(isChoice) {
    $('answerInput').style.display='none'; $('checkBtn').style.display='none'; makeChoices();
  } else {
    $('answerInput').style.display='block'; $('checkBtn').style.display='inline-block'; setTimeout(()=>$('answerInput').focus(),0);
  }
  updateStats();
}
function makeChoices() {
  const mode=$('modeSelect').value;
  const answer = mode==='word2def' ? current.definition : current.term;
  const distractors = shuffle(WORDS.filter(w=>w.term!==current.term)).slice(0,3).map(w=> mode==='word2def' ? w.definition : w.term);
  const choices=shuffle([answer,...distractors]);
  choices.forEach(c=>{ const btn=document.createElement('button'); btn.className='choice'; btn.textContent= mode==='word2def' ? shortDef(c) : c; btn.onclick=()=>checkChoice(c); $('choices').appendChild(btn); });
}
function mark(ok) {
  if(answered) return;
  answered=true;
  stats.done++; if(ok) { stats.correct++; delete wrongMap[keyOf(current)]; } else { stats.wrong++; wrongMap[keyOf(current)]={term:current.term, definition:current.definition, chapter:current.chapter}; }
  localStorage.setItem('tkam_wrong_words', JSON.stringify(wrongMap)); updateWrongList(); updateStats();
}
function checkInput() {
  if(!current) return;
  if(answered) { next(); return; }
  const ans=$('answerInput').value;
  const mode=$('modeSelect').value;
  const ok = mode==='word2def' ? definitionClose(ans, current.definition) : normalize(ans)===normalize(current.term);
  if(ok) { $('feedback').className='feedback ok'; $('feedback').innerHTML=`정답! <b>${current.term}</b><br><span>${current.definition}</span>`; }
  else { $('feedback').className='feedback no'; $('feedback').innerHTML=`오답.<br>정답 단어: <b>${current.term}</b><br><span>${current.definition}</span>`; }
  mark(ok);
}
function checkChoice(c) {
  if(!current || answered) return;
  const answer = currentAnswerText();
  const ok=c===answer;
  $('feedback').className='feedback '+(ok?'ok':'no');
  $('feedback').innerHTML= ok ? `정답! <b>${current.term}</b><br><span>${current.definition}</span>` : `오답. 정답: <b>${current.term}</b><br>${current.definition}`;
  [...$('choices').children].forEach(btn=>btn.disabled=true); mark(ok);
}
function next() { if(current) index++; showQuestion(); }
function showAnswer() { if(!current) return; answered=true; $('feedback').className='feedback no'; $('feedback').innerHTML=`정답: <b>${current.term}</b><br>${current.definition}`; }
function updateStats() {
  const total=pool.length||0; $('done').textContent=stats.done; $('correct').textContent=stats.correct; $('wrong').textContent=stats.wrong;
  $('accuracy').textContent=stats.done?Math.round(stats.correct/stats.done*100)+'%':'0%'; $('left').textContent=Math.max(total-index,0);
  $('savedWrong').textContent=Object.keys(wrongMap).length; $('bar').style.width= total? Math.min(100,index/total*100)+'%' : '0%';
}
function updateWrongList() {
  const vals=Object.values(wrongMap); $('savedWrong').textContent=vals.length;
  if(!vals.length) { $('wrongList').innerHTML='<div class="hint">아직 틀린 단어가 없습니다.</div>'; return; }
  $('wrongList').innerHTML=vals.map(w=>`<div class="wrong-item"><div class="term">${escapeHtml(w.term)} <span style="color:#68738a">${escapeHtml(w.chapter)}</span></div><div>${escapeHtml(shortDef(w.definition))}</div></div>`).join('');
}
function resetWrongWords() {
  if(!Object.keys(wrongMap).length) { $('feedback').className='feedback'; $('feedback').textContent=''; return; }
  if(!confirm('저장된 틀린 단어 목록을 모두 초기화할까요?')) return;
  wrongMap = {}; localStorage.removeItem('tkam_wrong_words'); updateWrongList(); updateStats();
  if($('orderSelect').value==='wrong') start();
  $('feedback').className='feedback ok'; $('feedback').textContent='틀린 단어 목록을 초기화했습니다.';
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function renderTable(arr) { $('wordTable').innerHTML=arr.map(w=>`<tr><td>${escapeHtml(w.chapter)}</td><td><b>${escapeHtml(w.term)}</b></td><td>${escapeHtml(w.definition)}</td></tr>`).join(''); }

$('startBtn').onclick=start; $('checkBtn').onclick=checkInput; $('nextBtn').onclick=next; $('showBtn').onclick=showAnswer; $('resetWrongBtn').onclick=resetWrongWords;
$('answerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') { e.preventDefault(); checkInput(); } });
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.isComposing) return;
  const id=e.target && e.target.id;
  if(id==='searchInput') return;
  if(id==='answerInput') return;
  if(current && (answered || isFeedbackShown())) { e.preventDefault(); next(); }
});
$('modeSelect').onchange=start; $('formatSelect').onchange=start; $('chapterSelect').onchange=()=>{ renderTable(getFiltered()); start(); }; $('orderSelect').onchange=start;
$('toggleListBtn').onclick=()=>{ const el=$('tableWrap'); const open=el.style.display==='block'; el.style.display=open?'none':'block'; $('toggleListBtn').textContent=open?'전체 단어표 보기':'전체 단어표 닫기'; };
$('searchInput').oninput=()=>{ const q=normalize($('searchInput').value); renderTable(WORDS.filter(w=>normalize(w.term).includes(q)||normalize(w.definition).includes(q)||normalize(w.chapter).includes(q))); };
$('clearSearch').onclick=()=>{ $('searchInput').value=''; renderTable(WORDS); };
init();
</script>
</body>
</html>
